[package]
name = "todo-app"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
serde = { version = "1.0", features = ["derive"] }
gloo = "0.11"
gloo-net = "0.5"
gloo-storage = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]
